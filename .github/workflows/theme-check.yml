name: Theme Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  theme-check:
    name: Lint theme
    runs-on: ubuntu-latest

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@4.5.2

      # Fails the build on errors only. Warnings are reported in the log but do
      # not block, because the stock Beautify theme ships with a number of them.
      - name: Run theme check
        run: shopify theme check --fail-level error
